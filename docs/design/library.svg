  <title id="title">NoMusic 深色曲库设计示意</title>
  <desc id="desc">左侧六个一级入口，右侧曲库分类与歌曲列表，底部悬浮播放条。当前播放歌曲为回家路上，所有内容均为设计示例，此图不是应用截图。</desc>
